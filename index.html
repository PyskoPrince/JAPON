<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Guide to Privacy Impact Assessment | Human System</title>
<meta name="description" content="Interactive edition of the Global Guide to Privacy Impact Assessment (PIA / DPIA), 2026, 1st Edition: methodology, regulatory framework by region, templates and sources.">
<meta name="theme-color" content="#0A1120">
<meta property="og:type" content="book">
<meta property="og:title" content="Global Guide to Privacy Impact Assessment">
<meta property="og:description" content="A practical PIA / DPIA methodology for public and private organizations. 2026, 1st Edition. Human System.">
<link rel="icon" href="https://storage.googleapis.com/humansystem/ISOTYPE.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iceland&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0A1120; --night-2:#0F1B2E; --deep:#1F4E67;
  --cyan:#4CA1AF; --cyan-ink:#0E7C86; --cyan-tint:#EAF5F6; --cyan-line:#BFE0E4;
  --orange:#F57C1F; --orange-ink:#B4500B; --orange-tint:#FDE3CE; --orange-soft:#FFF5EE; --orange-line:#F2CDB0;
  --red:#D71D00; --ink:#1C2733; --muted:#56636F; --line:#E2E7EB; --paper:#FFFFFF; --paper-2:#F5F8F9;
  --lvl-critical:#C81E1E; --lvl-high:#C2570C; --lvl-medium:#F59E0B; --lvl-low:#15803D;
  --nav-h:68px; --radius:14px;
  --display:'Iceland','Raleway',system-ui,sans-serif;
  --text:'Raleway',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--nav-h) + 18px);-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.7;font-variant-numeric:lining-nums}
img{max-width:100%;height:auto}
a{color:var(--cyan-ink);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--deep)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--orange);color:var(--night);padding:10px 16px;border-radius:10px;font-weight:700;z-index:2000;text-decoration:none}
.skip:focus{top:12px}

/* ---------- progress + navbar ---------- */
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--cyan),var(--orange));z-index:1200;transition:width .1s linear}
.nav{position:sticky;top:0;z-index:1100;height:var(--nav-h);background:#fff;box-shadow:0 4px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:18px;padding:0 clamp(16px,3vw,32px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--deep);min-width:0}
.brand img{width:42px;height:42px;border-radius:20%}
.wordmark{font-family:var(--display);font-size:1.75rem;line-height:1;font-style:italic;font-weight:700;white-space:nowrap}
.wordmark .h{color:var(--deep)} .wordmark .s{color:var(--red)}
.brand-sep{width:1px;height:28px;background:var(--line)}
.brand-doc{font-weight:600;font-size:.95rem;color:var(--muted);white-space:nowrap}
.nav-spacer{flex:1}
.search{position:relative;width:min(340px,32vw)}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 14px 0 40px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--paper-2)}
.search input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(76,161,175,.25);background:#fff}
.search svg{position:absolute;left:13px;top:12px;width:18px;height:18px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;max-width:100%;white-space:normal;text-align:left;border-radius:12px;padding:12px 22px;font-weight:700;font-size:.98rem;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:var(--text);line-height:1.1;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
.btn svg{width:18px;height:18px}
.btn-orange{background:var(--orange);color:var(--night)}
.btn-orange:hover{color:var(--night);transform:translateY(-2px);box-shadow:0 10px 24px rgba(245,124,31,.35)}
.btn-cyan{background:transparent;color:#fff;border-color:var(--cyan)}
.btn-cyan:hover{color:#fff;background:rgba(76,161,175,.16)}
.content .btn-cyan{color:var(--cyan-ink);border-color:var(--cyan)}
.content .btn-cyan:hover{background:var(--cyan-tint);color:var(--deep)}
.nav .btn{padding:10px 16px}
.icon-btn{display:none;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--deep);cursor:pointer}
.icon-btn svg{width:22px;height:22px}

/* ---------- search results ---------- */
.results{position:fixed;top:calc(var(--nav-h) + 8px);right:clamp(16px,3vw,32px);width:min(560px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 48px rgba(10,17,32,.18);z-index:1150;padding:8px}
.results[hidden]{display:none}
.results p.hint{margin:10px 12px;color:var(--muted);font-size:.92rem}
.results a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}
.results a .r-where{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.results a .r-title{display:block;font-weight:700;color:var(--deep)}
.results a .r-snip{display:block;font-size:.9rem;color:var(--ink);line-height:1.5;margin-top:2px}
.results a[aria-selected=true],.results a:hover{background:var(--cyan-tint)}
mark{background:#FFE3C7;color:inherit;border-radius:3px;padding:0 1px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--night) 0%,var(--deep) 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(76,161,175,.07) 1px,transparent 1px),linear-gradient(0deg,rgba(76,161,175,.07) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(180deg,#000 30%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 100%)}
.hero-inner{position:relative;max-width:1280px;margin:0 auto;padding:clamp(56px,8vw,104px) clamp(20px,4vw,48px) clamp(64px,8vw,112px);display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(32px,5vw,72px);align-items:center}
.edition{display:inline-block;border:1px solid var(--cyan);color:#CDEBEF;border-radius:999px;padding:6px 16px;font-weight:600;font-size:.92rem;margin:0 0 22px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,6.4vw,5.6rem);line-height:.92;letter-spacing:.5px;margin:0;text-transform:uppercase}
.hero .sub{font-family:var(--display);font-size:clamp(1.6rem,2.6vw,2.2rem);color:var(--orange);margin:14px 0 18px;letter-spacing:1px}
.hero .lead{font-size:1.14rem;line-height:1.65;color:rgba(255,255,255,.86);max-width:36em;margin:0 0 28px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.hero-meta{color:rgba(255,255,255,.66);font-size:.95rem;margin:0;max-width:36em}

/* risk matrix */
.matrix-panel{background:rgba(15,23,42,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(76,161,175,.55);border-radius:24px;padding:clamp(20px,3vw,30px);box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
.matrix-panel h2{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0 0 6px;letter-spacing:.5px}
.matrix-panel .how{margin:0 0 18px;color:rgba(255,255,255,.75);font-size:.95rem;line-height:1.55}
.matrix-wrap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:8px}
.axis-y{grid-row:1;grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);font-size:.82rem;color:rgba(255,255,255,.7);text-align:center;font-weight:600}
.axis-x{grid-row:2;grid-column:2;font-size:.82rem;color:rgba(255,255,255,.7);text-align:center;font-weight:600}
.matrix{grid-row:1;grid-column:2;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1/1;border:0;border-radius:10px;font-family:var(--display);font-size:clamp(1.15rem,2vw,1.6rem);color:var(--night);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,box-shadow .15s ease;position:relative}
.cell:hover,.cell:focus-visible,.cell[aria-pressed=true]{transform:scale(1.07);box-shadow:0 0 0 3px #fff,0 10px 22px rgba(0,0,0,.35);z-index:2;outline:none}
.cell.b-low{background:var(--cyan)} .cell.b-medium{background:#F4AE6A} .cell.b-high{background:var(--orange)} .cell.b-critical{background:var(--red);color:#fff}
.readout{margin-top:18px;min-height:150px;border-top:1px solid rgba(255,255,255,.14);padding-top:16px}
.readout .ro-score{font-family:var(--display);font-size:2.3rem;line-height:1;margin:0 0 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ro-chip{font-family:var(--text);font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--night)}
.ro-chip.b-low{background:var(--cyan)} .ro-chip.b-medium{background:#F4AE6A} .ro-chip.b-high{background:var(--orange)} .ro-chip.b-critical{background:var(--red);color:#fff}
.readout p{margin:0 0 6px;font-size:.95rem;line-height:1.5;color:rgba(255,255,255,.85)}
.readout .ro-anchor{color:rgba(255,255,255,.66);font-size:.88rem}
.readout a{color:#9EDCE4}
@media (prefers-reduced-motion:no-preference){
  .matrix.animate .cell{opacity:0;transform:scale(.6);animation:cellIn .5s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d) * 45ms)}
}
@keyframes cellIn{to{opacity:1;transform:scale(1)}}

/* ---------- layout ---------- */
.layout{max-width:1280px;margin:0 auto;padding:clamp(28px,4vw,56px) clamp(16px,3vw,32px) 80px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start}
.toc{position:sticky;top:calc(var(--nav-h) + 18px);max-height:calc(100vh - var(--nav-h) - 36px);overflow:auto;background:var(--night);color:#fff;border-radius:20px;padding:22px 14px 18px;scrollbar-width:thin;scrollbar-color:var(--cyan) transparent}
.toc::-webkit-scrollbar{width:5px} .toc::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:10px}
.toc-title{font-family:var(--display);font-size:1.5rem;margin:0 10px 12px;letter-spacing:.5px}
.toc ol{list-style:none;margin:0;padding:0}
.toc .ch>a{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:baseline;padding:7px 10px;border-radius:10px;color:rgba(255,255,255,.86);text-decoration:none;font-size:.92rem;line-height:1.35;font-weight:600}
.toc .ch>a .n{font-family:var(--display);font-size:1.25rem;color:var(--orange);font-weight:400}
.toc .ch>a:hover{background:rgba(255,255,255,.06);color:#fff}
.toc .ch.is-active>a{background:rgba(76,161,175,.16);color:#fff}
.toc .subs{display:none;margin:2px 0 8px 44px;border-left:1px solid rgba(76,161,175,.35)}
.toc .ch.is-open .subs{display:block}
.toc .subs a{display:block;padding:5px 10px 5px 12px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.84rem;line-height:1.35;border-left:2px solid transparent;margin-left:-1px}
.toc .subs a.l3{padding-left:24px;font-size:.8rem;color:rgba(255,255,255,.58)}
.toc .subs a .sn{color:#9EDCE4;margin-right:6px;font-variant-numeric:tabular-nums}
.toc .subs a:hover{color:#fff}
.toc .subs a[aria-current=true]{color:#fff;border-left-color:var(--orange)}
.toc-foot{margin:16px 10px 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:.86rem}
.toc-foot a{color:#9EDCE4}
.toc-close{display:none}
.scrim{display:none}

/* ---------- content ---------- */
.content{min-width:0;max-width:780px}
.content p,.content li{max-width:70ch;overflow-wrap:anywhere}
.content p{margin:0 0 1.05em}
.chapter{margin:0 0 72px}
.ch-open{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--night) 0%,#163a4f 100%);color:#fff;border-radius:22px;padding:clamp(26px,4vw,40px);margin:0 0 36px;display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,32px);align-items:center}
.ch-num{font-family:var(--display);font-size:clamp(5rem,11vw,8.4rem);line-height:.8;color:var(--orange)}
.ch-kicker{margin:0 0 6px;color:#9EDCE4;font-weight:600;font-size:.95rem}
.ch-open h2{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,4.4vw,3.2rem);line-height:1;margin:0;letter-spacing:.5px}
.ch-open .ch-sections{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.ch-open .ch-sections a{display:inline-block;font-size:.84rem;color:rgba(255,255,255,.8);text-decoration:none;border:1px solid rgba(76,161,175,.45);border-radius:999px;padding:3px 11px}
.ch-open .ch-sections a:hover{border-color:var(--orange);color:#fff}
.ch-open.solo{grid-template-columns:1fr}

h3.sec,h4.sec,h5.sec{color:var(--deep);line-height:1.25;margin:2.4em 0 .7em;scroll-margin-top:calc(var(--nav-h) + 18px)}
h3.sec{font-size:1.62rem;font-weight:700;display:flex;gap:14px;align-items:baseline}
h3.sec .sec-num{font-family:var(--display);font-weight:400;font-size:1.9rem;color:var(--orange-ink);flex:none}
h4.sec{font-size:1.28rem;font-weight:700;display:flex;gap:10px;align-items:baseline}
h4.sec .sec-num{font-family:var(--display);font-weight:400;font-size:1.45rem;color:var(--cyan-ink);flex:none}
h5.sec{font-size:1.08rem;font-weight:700}
.sec.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:rgba(245,124,31,.25)}100%{background:transparent}}
.minor-head{font-weight:700;color:var(--orange-ink);margin:1.6em 0 .5em!important}
.small-note{font-size:.93rem;color:var(--muted)}
.current{font-size:.88rem;color:var(--muted);font-style:italic;margin-top:.6em!important}
blockquote.pull{margin:0 0 26px;padding:0;border:0}
blockquote.pull p{font-family:var(--display);font-size:clamp(1.9rem,3.6vw,2.6rem);line-height:1.05;color:var(--deep);margin:0;max-width:22em}

.content ul,.content ol{padding-left:1.3em;margin:0 0 1.2em}
.content ul>li{margin:.35em 0;padding-left:.2em}
.content ul>li::marker{color:var(--cyan)}
.content ol>li::marker{color:var(--orange-ink);font-weight:700}
.content ul.lettered{list-style:none;padding-left:0}
.content ul.lettered>li{padding-left:2.1em;text-indent:-2.1em}
.content ul.lettered>li strong:first-child{display:inline-block;width:2.1em;text-indent:0;color:var(--orange-ink)}

/* timeline */
.timeline{list-style:none;margin:8px 0 28px!important;padding:0!important;position:relative}
.timeline::before{content:"";position:absolute;left:84px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--cyan),var(--orange))}
.timeline li{display:grid;grid-template-columns:72px 1fr;gap:32px;margin:0 0 14px;position:relative}
.timeline li::after{content:"";position:absolute;left:79px;top:10px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--orange)}
.tl-year{font-family:var(--display);font-size:1.45rem;color:var(--orange-ink);text-align:right;line-height:1.2}
.tl-year strong{font-weight:400}
.timeline p{margin:0!important}

/* key figures */
.figures{background:var(--night);color:#fff;border-radius:22px;padding:clamp(22px,3.5vw,34px);margin:10px 0 26px}
.fig-group+.fig-group{margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12)}
.fig-title{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 14px;color:#9EDCE4;letter-spacing:.5px}
.figures ul{list-style:none;margin:0!important;padding:0!important;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
.figures li{margin:0!important;padding:0!important;max-width:none!important}
.fig-num{display:block;font-family:var(--display);font-size:clamp(2.3rem,4.2vw,3rem);line-height:1;color:var(--orange)}
.figures li p{font-size:.95rem;line-height:1.55;color:rgba(255,255,255,.86);margin:6px 0 4px!important}
.fig-src{font-size:.8rem;color:#9EDCE4;font-weight:600}
.fig-note{font-size:.84rem;color:rgba(255,255,255,.6);margin:14px 0 0!important}

/* glossary */
.glossary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin:6px 0 28px}
.glossary>div{padding:14px 0;border-top:1px solid var(--line)}
.glossary dt{font-weight:700;color:var(--deep);margin-bottom:4px}
.glossary dd{margin:0;font-size:.97rem}

/* triplet (4.2) */
.triplet{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:6px 0 24px!important}
.triplet li{margin:0!important;padding:18px!important;border:1px solid var(--orange-line);border-top:4px solid var(--orange);border-radius:var(--radius);background:var(--orange-soft)}
.triplet h5{margin:0 0 8px;font-size:1.02rem;color:var(--deep);line-height:1.3}
.triplet p{margin:0!important;font-size:.95rem}

/* tables */
.table-wrap{position:relative;margin:10px 0 28px;overflow-x:auto;border:1px solid var(--orange-line);border-radius:var(--radius);background:#fff;-webkit-overflow-scrolling:touch}
.table-tools{display:flex;justify-content:flex-end;margin:10px 0 -4px}
.expand{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:600 .82rem var(--text);color:var(--cyan-ink);cursor:pointer}
.expand:hover{border-color:var(--cyan);background:var(--cyan-tint)}
.expand svg{width:14px;height:14px}
table.data{width:100%;border-collapse:collapse;font-size:.93rem;line-height:1.5}
table.data.wide{min-width:880px}
table.data thead th{background:var(--orange);color:var(--night);font-weight:700;text-align:left;padding:11px 14px;vertical-align:bottom;border-bottom:1px solid var(--orange-line)}
table.data thead th strong{font-weight:700}
table.data tbody th{background:var(--orange-tint);color:var(--ink);text-align:left;font-weight:700;min-width:130px}
table.data th strong{font-weight:inherit}
table.data td,table.data tbody th{padding:11px 14px;border-top:1px solid var(--orange-line);vertical-align:top}
table.data td+td,table.data th+td{border-left:1px solid #F6E2D2}
table.data td.lvl-critical{background:var(--lvl-critical);color:#fff;font-weight:700}
table.data td.lvl-high{background:var(--lvl-high);color:#fff;font-weight:700}
table.data td.lvl-medium{background:var(--lvl-medium);color:var(--night);font-weight:700}
table.data td.lvl-low{background:var(--lvl-low);color:#fff;font-weight:700}
table.data td.tint{background:var(--orange-soft)}
table.data td.tint-red{background:#FDECEC}
table.data a{overflow-wrap:anywhere}
table.contacts td:nth-child(2) a{overflow-wrap:normal}
table.authorities td.web a{white-space:nowrap}
table.contacts th[scope=row]{width:46%}
table.contacts td:nth-child(2){min-width:300px}
table.contacts td:nth-child(2) a{white-space:nowrap}
table.contacts td:nth-child(3){white-space:nowrap}
.ch-num.glyph{font-size:clamp(5rem,10vw,7.4rem);line-height:.7}
table.authorities tr[hidden]{display:none}

/* callouts */
.callout{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;border-radius:var(--radius);padding:18px 20px;margin:18px 0 28px;border:1px solid var(--line);background:var(--paper-2)}
.callout-icon{width:30px;height:30px;color:var(--deep)}
.callout-icon svg{width:30px;height:30px}
.callout p{max-width:none!important;margin:0 0 .6em}
.callout p:last-child{margin-bottom:0}
.callout-title{font-weight:700;color:var(--deep);font-size:1.02rem}
.callout .item{padding-left:1.9em;text-indent:-1.9em;margin:0 0 .35em}
.callout.rec{background:var(--cyan-tint);border-color:var(--cyan-line);border-left:5px solid var(--cyan)}
.callout.rec .callout-icon,.callout.rec .callout-title{color:var(--cyan-ink)}
.callout.objective{background:#fff;border-color:var(--orange-line);border-left:5px solid var(--orange)}
.callout.objective .callout-icon,.callout.objective .callout-title{color:var(--orange-ink)}
.callout.alert{background:#FFF1EC;border-color:#F6C9BB;border-l
